  title: "새 기준 미션 클리어"
  started_at: "2026-08-16"
  baseline: "restart-20260816"
  mode: START
  current_mission: B1-1
  beginner_message: "필수 미션부터 B1-1에서 시작합니다. 지금 해야 할 한 단계만 진행하면 됩니다."

execution_plan:
  required_first:
    - B1-1
    - B1-2
    - B2-1
    - B2-2
    - B3-1
    - B3-2
    - B4-1
    - B5-1
    - B6-1
    - B6-2
