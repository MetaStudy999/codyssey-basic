cycle_state_values:
  - NOT_STARTED
  - READY
  - ACTIVE
  - CLEAR
  - BLOCKED

state_labels:
  NOT_STARTED: "시작 전"
  READY: "시작 가능"
  ACTIVE: "진행 중"
  CLEAR: "미션 완료"
  BLOCKED: "문제 해결 필요"

gate_display:
  G1_SOURCE:
    step: 1
    title: "미션 이해하기"
    short: "미션 이해"
    action: "미션 원문과 평가 기준을 대조해 반드시 해야 할 일을 체크합니다."
    why: "처음부터 구현하지 않고 통과 조건을 먼저 고정하면 시행착오를 줄일 수 있습니다."
    completion: "필수 요구사항과 평가 항목을 체크리스트로 설명할 수 있습니다."
  G2_BUILD:
    step: 2
    title: "필수 기능 만들기"
    short: "만들기"
    action: "미션 통과에 필요한 최소 필수 기능부터 구현합니다."
    why: "선택 기능보다 필수 미션 클리어를 먼저 확보하기 위해서입니다."
    completion: "필수 코드와 설정이 저장소에 존재합니다."
  G3_TEST:
    step: 3
    title: "테스트하기"
    short: "테스트"
    action: "필수 기능이 예상대로 동작하는지 재현 가능한 방법으로 확인합니다."
    why: "구현 존재와 실제 동작은 다르기 때문입니다."
    completion: "필수 테스트가 통과하고 다시 실행할 수 있습니다."
  G4_REVIEW:
    step: 4
    title: "빠진 것 검토하기"
    short: "검토"
    action: "평가 기준과 비교해 누락·오류·과장된 PASS가 없는지 확인합니다."
    why: "제출 직전의 큰 감점을 빠르게 제거하기 위해서입니다."
    completion: "BLOCKER와 MAJOR 문제가 없거나 해결 계획이 분명합니다."
  G5_RUNTIME:
    step: 5
    title: "실제로 실행하기"
    short: "실행 확인"
    action: "실제 Ubuntu·브라우저·클라우드 등 필요한 환경에서 직접 실행합니다."
    why: "자동 검사만으로 확인할 수 없는 실제 동작을 검증하기 위해서입니다."
    completion: "실제 실행 결과가 확인되었습니다."
  G6_EVIDENCE:
    step: 6
    title: "증빙 남기기"
    short: "증빙"
    action: "명령 결과, 로그, 화면, 링크 등 평가자가 확인할 근거를 남깁니다."
    why: "통과 여부를 추측이 아니라 증거로 확인하기 위해서입니다."
    completion: "필수 평가 항목마다 확인 가능한 증빙이 연결되었습니다."
  G7_LEARN:
    step: 7
    title: "핵심만 이해하기"
    short: "학습"
    action: "미션 수행에 꼭 필요한 용어와 흐름을 자기 말로 설명합니다."
    why: "급하게 통과한 결과를 실제 실력으로 바꾸기 위해서입니다."
    completion: "핵심 개념과 작업 순서를 간단히 설명할 수 있습니다."
  G8_MERGE:
    step: 8
    title: "미션 완료 반영하기"
    short: "완료 반영"
    action: "최종 결과와 증빙을 정리하고 현재 Cycle에서 Mission Clear로 반영합니다."
    why: "다음 미션으로 안전하게 넘어가기 위한 기준점을 만들기 위해서입니다."
    completion: "필수 Gate와 증빙이 충족되어 Mission Clear로 기록되었습니다."

