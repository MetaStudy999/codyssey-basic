version: 3
model: codyssey-developer-growth-os-opportunities

# Opportunity는 외부 기회 자체의 상태만 관리한다.
# 사용자가 실제 참가/수행을 시작한 뒤의 진행 상태는 config/activities.yaml에서 관리한다.

availability_status_values:
  - OPEN
  - UPCOMING
  - WATCH
  - CLOSED
  - ARCHIVED

fit_status_values:
  - UNREVIEWED
  - REVIEW
  - CANDIDATE
  - SELECTED
  - SKIP

priority_values:
  - REQUIRED
  - RECOMMENDED
  - OPTIONAL

types:
  - competition
  - contest
  - hackathon
  - seminar
  - conference
  - meetup
  - call-for-papers
  - call-for-projects
  - call-for-participants
  - research-opportunity
  - open-source-opportunity
  - grant-support
  - startup-opportunity
  - job-opportunity

record_fields:
  - id
  - title
  - type
  - availability_status
  - fit_status
  - recommended_growth_stage
  - priority
  - official_url
  - application_deadline
  - event_start
  - event_end
  - checked_at
  - related_missions
  - related_skills
  - reuse_assets
  - expected_evidence
  - opportunity_score
  - notes

opportunity_score_dimensions:
  mission_alignment: 25
  portfolio_value: 20
  learning_value: 20
  collaboration_value: 15
  result_probability: 10
  career_or_venture_link: 10

selection_guideline:
  active: ">= 80"
  review: "65-79"
  optional_if_capacity: "50-64"
  skip: "< 50"

# 실제 외부 기회는 시한과 상태가 자주 바뀌므로 공식 URL과 확인일을 반드시 기록한다.
# SELECTED 후 실제 수행을 시작하면 config/activities.yaml에 별도 Activity를 만든다.
opportunities: []
