schema_version: 1
contract_type: ENVIRONMENT
mission_id: B1-1
execution_root: training/round-03-apos
status: PRE_START

runtime:
  authoritative_local_readback_required: true
  preferred_profile: imac-orbstack-ubuntu
  browser_required: true
  local_http_server_required: true
  git_required: true
  github_cli_optional: true

start_readback:
  required:
    - host_identity
    - guest_or_container_identity
    - current_user
    - current_repository
    - remote_origin
    - main_head
    - worktree_cleanliness
    - browser_availability
    - runtime_versions
    - network_reachability_if_needed

proposed_branch:
  name: round-03/b1-1-apos
  create_only_after_owner_start_approval: true

host_mutation:
  mode: HITL_MANUAL_ONLY
  forbidden_without_explicit_approval:
    - sudoers_change
    - service_change
    - firewall_change
    - package_removal
    - runner_change
    - macos_admin_change

recovery:
  before_mutation:
    - record_main_head
    - record_branch
    - record_git_status
  rollback:
    - preserve_round_01
    - preserve_round_02
    - isolate_round_03_changes


source_of_truth:
  round_03_authoring_root: training/round-03-apos/04-src
  prior_root_implementation_role: REFERENCE_ONLY
  prior_round_02_role: REFERENCE_ONLY
  dual_writable_source_forbidden: true
  deployment_method: REVALIDATE_AT_START
  default_github_pages_preview_if_main_root_serves_repository: "/training/round-03-apos/04-src/"
  rules:
    - "Round 03 authoring source와 repository root 기존 구현을 동시에 수정하지 않는다."
    - "배포 방식이 확정되기 전 root로 코드를 복사해 두 개의 기준원을 만들지 않는다."
    - "배포 결과는 Tested Candidate와 연결해 검증한다."
