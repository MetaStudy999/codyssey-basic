schema_version: 1
mission:
  id: "<B?-?>"
  title: "<TITLE>"

control_tower:
  repository: "MetaStudy999/codyssey-basic"
  baseline_sha: "<SHA>"
  drift: "NONE" # NONE | FOUND

mission_repository:
  repository: "<OWNER/REPO>"
  baseline_sha: "<SHA>"
  final_commit_sha: "<SHA>"
  pull_request: "<URL>"
  merge_status: "<OPEN|MERGED|NOT_REQUIRED>"

source:
  mode: "<FULL_SOURCE|MISSION_LED|EVALUATION_LED|PARTIAL_SOURCE|SOURCE_GAP|SOURCE_CONFLICT>"
  confidence: "<HIGH|MEDIUM|LOW>"
  mission_source:
    state: "<VALID|PARTIAL|EMPTY|MISSING|UNREADABLE|DUPLICATE|CONFLICT|HISTORICAL|UNVERIFIED>"
    location: "<PATH_OR_URL>"
  evaluation_source:
    state: "<VALID|PARTIAL|EMPTY|MISSING|UNREADABLE|DUPLICATE|CONFLICT|HISTORICAL|UNVERIFIED>"
    location: "<PATH_OR_URL>"
  gaps: []

execution:
  status: "<TODO|IMPLEMENTED|TESTED|PASS|NEEDS-RUNTIME|BLOCKED>"
  learning: "<NOT-STUDIED|PRACTICED|EXPLAINABLE|MASTERED>"
  current_gate: "<G1_SOURCE|G2_BUILD|G3_TEST|G4_REVIEW|G5_RUNTIME|G6_EVIDENCE|G7_LEARN|G8_MERGE>"
  verdict: "<ACCEPT|PARTIAL|NEEDS-RUNTIME|BLOCKED|REJECT>"

gates:
  G1_SOURCE: "<TODO|PASS|NEEDS-RUNTIME|BLOCKED>"
  G2_BUILD: "<TODO|PASS|NEEDS-RUNTIME|BLOCKED>"
  G3_TEST: "<TODO|PASS|NEEDS-RUNTIME|BLOCKED>"
  G4_REVIEW: "<TODO|PASS|NEEDS-RUNTIME|BLOCKED>"
  G5_RUNTIME: "<TODO|PASS|NEEDS-RUNTIME|BLOCKED>"
  G6_EVIDENCE: "<TODO|PASS|NEEDS-RUNTIME|BLOCKED>"
  G7_LEARN: "<TODO|PASS|NEEDS-RUNTIME|BLOCKED>"
  G8_MERGE: "<TODO|PASS|NEEDS-RUNTIME|BLOCKED>"

requirements:
  confirmed: 0
  passed: 0
  partial: 0
  failed: 0
  unverified: 0

validation:
  tests: "<PASS|FAIL|NOT_APPLICABLE>"
  commands: []
  blocker: 0
  major: 0
  minor: 0

runtime:
  required: false
  owner: "<AI|HUMAN|NONE>"
  result: "<PASS|NEEDS_RUNTIME|FAIL|NOT_APPLICABLE>"
  notes: ""

evidence:
  complete: false
  locations: []
  missing: []

dependency:
  state: "<NONE|REQUIRED|RECOMMENDED|UNVERIFIED>"
  related_missions: []

risks: []
backlog: []

representative_integration:
  required: true
  status: "PENDING" # PENDING | ACCEPTED | PARTIAL | BLOCKED | REJECTED | MERGED
  requested_updates:
    - "config/missions.yaml"
  generated_outputs_direct_edit: false
