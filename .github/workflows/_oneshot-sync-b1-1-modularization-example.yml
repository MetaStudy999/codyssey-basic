name: One-shot B1-1 modularization example sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_oneshot-sync-b1-1-modularization-example.yml'

permissions:
  contents: write

jobs:
  sync-example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync B1-1 reference pattern with applied structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('standards/BEGINNER-GUIDE-MODULARIZATION-STANDARD.md')
          expected = '6274c5b696fac935e4a0f26b11f93fcd20683ff1'
          actual = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          if actual != expected:
              raise SystemExit(f'drift: expected {expected}, got {actual}')

          text = path.read_text(encoding='utf-8')
          old = '''guide/04-AGENT-RUNTIME.md         = STEP 06~07\nguide/05-MONITOR-AND-CRON.md      = STEP 08~11\nguide/06-VERIFICATION-AND-EVIDENCE.md = STEP 12~14\nguide/07-FINAL-CLEAR.md           = STEP 15 + 최종 상태 판정'''
          new = '''guide/04-AGENT-RUNTIME.md         = STEP 06~07\nguide/05-MONITOR-AND-LOG-ROTATION.md = STEP 08~09\nguide/06-CRON-FAILURE-WARNING.md  = STEP 10~11\nguide/07-VERIFICATION-AND-EVIDENCE.md = STEP 12~14\nguide/08-FINAL-CLEAR.md           = STEP 15 + 최종 상태 판정'''
          if old not in text:
              raise SystemExit('B1-1 reference pattern block missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit sync and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standards/BEGINNER-GUIDE-MODULARIZATION-STANDARD.md
          git rm .github/workflows/_oneshot-sync-b1-1-modularization-example.yml
          git commit -m 'docs: sync B1-1 modularization reference pattern'
          git push origin HEAD:main
