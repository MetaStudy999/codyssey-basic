          old = '+ 모듈화 Trigger에 해당하면 중앙 허브(BEGINNER-GUIDE.md) + guide/ 모듈 구조'
          new = '+ 모듈화 Trigger에 해당하면 중앙 허브(BEGINNER-GUIDE.md) + 모듈 README 목차 + 세부 학습 문서의 3계층 구조'
          if old not in text:
