name: One-shot three-level beginner guide information architecture

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_oneshot-three-level-guide-standard.yml'

permissions:
  contents: write

jobs:
  patch-standards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mandatory three-level guide architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              'standards/BEGINNER-GUIDE-MODULARIZATION-STANDARD.md': '23750cdbc43a2bfc0d60a3f0d76ee2ac35af74cc',
              'standards/README.md': 'c337260233a74e1011d5c2e81b3c8dcfbc50ba19',
              'standards/BEGINNER-DOCUMENTATION-AUDIT.md': '8065aa1d1d20f6ed5189fec550e9bef89659733d',
          }
          for path, blob in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != blob:
                  raise SystemExit(f'drift: {path}: expected {blob}, got {actual}')

          path = Path('standards/BEGINNER-GUIDE-MODULARIZATION-STANDARD.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'Codyssey Basic의 긴 입문자 가이드(Beginner Guide)는 **한 파일에 모든 실행 단계와 설명을 계속 누적하지 않고, 중앙 허브(Hub) + 학습 모듈(Module)** 구조로 분리합니다.',
                  'Codyssey Basic의 긴 입문자 가이드(Beginner Guide)는 **한 파일에 모든 실행 단계와 설명을 계속 누적하지 않고, 중앙 허브(Hub) → 모듈 목차(Module Table of Contents, Module TOC) → 세부 학습 문서(Learning Unit)**의 3계층 정보 구조(Information Architecture, IA)로 관리합니다.'
              ),
              (
                  '```text\nBEGINNER-GUIDE.md = 중앙 허브(Hub)\n+\nguide/*.md         = 상세 학습·실행 모듈(Module)\n```',
                  '```text\nBEGINNER-GUIDE.md                    = 전체 중앙 허브(Hub)\n+\nguide/<NN-topic>/README.md          = 모듈 목차(Module TOC)\n+\nguide/<NN-topic>/<NN-unit>.md       = 세부 학습 문서(Learning Unit)\n```'
              ),
              (
                  '''```text
training/round-01-clear/
├── BEGINNER-GUIDE.md
├── guide/
│   ├── 00-OVERVIEW.md
│   ├── 01-<TOPIC>.md
│   ├── 02-<TOPIC>.md
│   ├── ...
│   └── NN-FINAL-CLEAR.md
├── CHECKLIST.md
├── environment/
├── docs/
└── evidence/
```

`BEGINNER-GUIDE.md`에는 전체 상세 명령을 다시 복제하지 않습니다. 상세 내용의 단일 기준은 해당 `guide/*.md` 모듈입니다.''',
                  '''```text
training/round-01-clear/
├── BEGINNER-GUIDE.md
├── guide/
│   ├── 00-overview/
│   │   └── README.md
│   ├── 01-<topic>/
│   │   ├── README.md
│   │   ├── 01-<unit>.md
│   │   └── 02-<unit>.md
│   ├── 02-<topic>/
│   │   ├── README.md
│   │   └── 01-<unit>.md
│   └── ...
├── CHECKLIST.md
├── environment/
├── docs/
└── evidence/
```

`BEGINNER-GUIDE.md`에는 전체 상세 명령을 다시 복제하지 않습니다. 각 모듈의 `README.md`도 상세 실습을 중복하지 않고 **해당 모듈의 목적·목차·완료 조건·이동 경로**를 담당합니다. 실제 상세 설명과 명령의 단일 기준은 해당 세부 학습 문서(Learning Unit)입니다.'''
              ),
              (
                  '''## 5. 각 모듈의 필수 구조

각 `guide/*.md`는 다음을 갖습니다.

```text
모듈 제목
→ 허브로 돌아가기
→ 현재 모듈의 목적
→ 모듈 목차(여러 STEP일 때)
→ 상세 STEP
→ 실행 위치(Context)
→ 실행 전 점검(Preflight)
→ 명령/코드 해설
→ 정상 기준
→ STOP / GO
→ 재실행 안전성(Rerun Safety)
→ 필요한 중간 저장점(Checkpoint) / 복구(Recovery)
→ 완료 확인
→ 이전 모듈 ← / → 다음 모듈
```

Cloud/API/AI 비용이 있으면 비용·자원 보호와 정리(Cleanup)까지 포함합니다.''',
                  '''## 5. 모듈 목차와 세부 학습 문서 — 필수

모듈화 판정(Trigger)에 해당한 미션은 각 기술 영역을 디렉터리로 관리하고, **모든 모듈 디렉터리에 `README.md`를 반드시 둡니다.**

### 5.1 모듈 `README.md` — 지역 목차(Local TOC)

```text
모듈 제목
→ 전체 허브로 돌아가기
→ 이 모듈의 목적/학습 목표
→ 관련 STEP 범위
→ 📑 모듈 목차(Module TOC)
→ 세부 학습 문서 링크
→ 모듈 완료 조건
→ 이전 모듈 ← / → 다음 모듈
```

모듈 `README.md`에는 상세 명령·코드·긴 해설을 복제하지 않습니다.

### 5.2 세부 학습 문서(Learning Unit)

실행형 모듈은 최소 1개의 세부 학습 문서를 둡니다. 각 세부 문서는 다음을 갖습니다.

```text
세부 문서 제목
→ 모듈 목차로 돌아가기
→ 이전/다음 세부 문서
→ STEP 또는 학습 단위 목적
→ 실행 위치(Context)
→ 실행 전 점검(Preflight)
→ 상세 설명/명령/코드 해설
→ 정상 기준
→ STOP / GO
→ 재실행 안전성(Rerun Safety)
→ 필요한 중간 저장점(Checkpoint) / 복구(Recovery)
→ 완료 확인
```

Cloud/API/AI 비용이 있으면 비용·자원 보호와 정리(Cleanup)까지 포함합니다.

### 5.3 모듈 내부 세분화 판정(Sub-module Split Trigger)

다음 중 하나라도 해당하면 하나의 상세 문서에 계속 누적하지 않고 **세부 학습 문서로 추가 분할하는 것을 필수(MUST)**로 합니다.

```text
[ ] 단일 상세 문서가 50KB 이상이다.
[ ] 단일 상세 문서가 700줄 이상이다.
[ ] 서로 독립된 STEP/학습 단위가 3개 이상이다.
[ ] 오류·검증·복구 경로가 분리되는 기술 개념이 2개 이상 존재한다.
[ ] 목차가 있어도 입문자가 현재 위치 또는 다음 행동을 찾기 어렵다.
```

파일 크기만으로 기계적으로 쪼개지 않습니다. **기술적 응집도(Cohesion)**를 우선하되, 위 Trigger가 하나라도 충족되면 분할하지 않는 이유를 문서에 명확히 남기지 않는 한 `BEGINNER READY`로 판정하지 않습니다.'''
              ),
              (
                  '''## 6. 파일 이름 규칙

파일 이름은 진행 순서를 정렬할 수 있도록 두 자리 번호를 앞에 둡니다.

```text
00-OVERVIEW.md
01-PREFLIGHT-AND-BASELINE.md
02-SSH-AND-FIREWALL.md
03-USERS-GROUPS-ACL.md
04-AGENT-RUNTIME.md
05-MONITOR-AND-CRON.md
06-VERIFICATION-AND-EVIDENCE.md
07-FINAL-CLEAR.md
```

미션 성격에 따라 `<TOPIC>`은 변경할 수 있지만 번호 순서와 역할은 명확해야 합니다.''',
                  '''## 6. 파일/디렉터리 이름 규칙

모듈 디렉터리와 세부 문서는 진행 순서를 정렬할 수 있도록 두 자리 번호를 앞에 둡니다.

```text
00-overview/README.md
01-preflight-baseline/README.md
01-preflight-baseline/01-baseline.md
01-preflight-baseline/02-prerequisites.md
02-ssh-firewall/README.md
02-ssh-firewall/01-ssh.md
02-ssh-firewall/02-firewall.md
...
```

미션 성격에 따라 `<topic>`과 `<unit>`은 변경할 수 있지만 번호 순서와 역할은 명확해야 합니다. 디렉터리·파일 이름은 짧고 안정적인 영문 kebab-case를 사용하고, 실제 학습 제목은 문서 내부에서 한글 중심으로 표기합니다.'''
              ),
              (
                  '''```text
BEGINNER-GUIDE.md
→ 00 → 01 → 02 → ... → FINAL

각 Module
→ 허브
→ 이전 Module
→ 다음 Module
```

여러 STEP이 있는 모듈은 클릭 가능한 내부 목차를 둡니다.''',
                  '''```text
LEVEL 1 — 전체 허브(Global Hub)
BEGINNER-GUIDE.md
        ↓
