              ),
              (
                  '**허브 + 모듈 + 양방향 탐색 + 내용 보존 + BEGINNER READY 강제 판정**',
                  '**전체 허브 + 모듈 README 목차 + 세부 학습 문서 + 양방향 탐색 + 내용 보존 + BEGINNER READY 강제 판정**'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected standard block:\n{old[:180]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          registry = Path('standards/README.md')
          text = registry.read_text(encoding='utf-8')
          old = '긴 `BEGINNER-GUIDE.md`를 한 파일에 계속 누적하지 않고 **중앙 허브(Hub) + `guide/` 학습 모듈(Module)** 구조로 관리합니다.'
          new = '긴 `BEGINNER-GUIDE.md`를 한 파일에 계속 누적하지 않고 **전체 중앙 허브(Hub) → 모듈별 `README.md` 목차(Module TOC) → 세부 학습 문서(Learning Unit)**의 3계층 정보 구조(Information Architecture, IA)로 관리합니다.'
          if old not in text:
              raise SystemExit('registry modularization summary missing')
          text = text.replace(old, new, 1)
          old = '''```text
BEGINNER-GUIDE.md = Quick Start + 전체 지도 + 모듈 링크

