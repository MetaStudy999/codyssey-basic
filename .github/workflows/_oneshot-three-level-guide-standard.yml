guide/<module>/README.md
        ↓
LEVEL 3 — 세부 학습 문서(Learning Unit)
01-*.md → 02-*.md → ...
```

필수 양방향 이동:

```text
전체 허브 → 모듈 README
모듈 README → 전체 허브 / 이전 모듈 / 다음 모듈 / 세부 문서
세부 문서 → 모듈 README / 이전 세부 문서 / 다음 세부 문서
```

모듈 `README.md`의 목차는 **연관된 개념·STEP을 학습 흐름 순서로 분류**하고, 파일 이름만 나열하지 않습니다.'''
              ),
              (
                  '''모듈화 Trigger에 해당하지만 한 파일에 상세 STEP 전체가 남아 있음
