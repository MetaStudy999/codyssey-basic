      - name: Commit standards and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standards/BEGINNER-GUIDE-MODULARIZATION-STANDARD.md standards/README.md standards/BEGINNER-DOCUMENTATION-AUDIT.md
          git rm .github/workflows/_oneshot-three-level-guide-standard.yml
          git commit -m 'docs: require three-level beginner guide architecture'
          git push origin HEAD:main
