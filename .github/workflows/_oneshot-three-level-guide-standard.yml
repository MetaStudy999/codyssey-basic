모듈의 이전/다음 이동 경로가 없음
분할 과정에서 STEP/요구사항/복구 내용이 누락됨
허브와 상세 모듈에 서로 다른 명령이 중복되어 기준이 갈림''',
                  '''모듈화 Trigger에 해당하지만 한 파일에 상세 STEP 전체가 남아 있음
모듈 디렉터리에 `README.md` 지역 목차가 없음
허브 → 모듈 README → 세부 학습 문서의 3계층 이동이 끊김
모듈/세부 문서의 이전·다음 이동 경로가 없음
모듈 내부 세분화 Trigger에 해당하지만 상세 문서가 계속 비대함
분할 과정에서 STEP/요구사항/복구 내용이 누락됨
허브·모듈 README·세부 문서에 서로 다른 명령이 중복되어 기준이 갈림'''
              ),
              (
                  '''```text
BEGINNER-GUIDE.md                 = 중앙 허브

guide/00-OVERVIEW.md             = 미션 개요 / 공식 기준 / 전체 흐름
