name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'config/missions.yaml'
      - 'config/cycles/**'
      - 'config/history/**'
      - 'config/waves/**'
      - 'config/growth.yaml'
      - 'config/skills.yaml'
      - 'config/activities.yaml'
      - 'config/projects.yaml'
      - 'config/opportunities.yaml'
      - 'scripts/sync_progress.py'
      - 'scripts/sync_growth.py'
      - 'scripts/validate_v3.py'
      - 'scripts/browser_smoke.py'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Control Tower data
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python scripts/sync_progress.py
          python scripts/sync_growth.py
      - name: Validate V3 structure and generated data
        run: |
          python scripts/validate_v3.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
