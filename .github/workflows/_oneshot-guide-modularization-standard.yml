[BEGINNER-GUIDE-MODULARIZATION-STANDARD.md](BEGINNER-GUIDE-MODULARIZATION-STANDARD.md)

긴 `BEGINNER-GUIDE.md`를 한 파일에 계속 누적하지 않고 **중앙 허브(Hub) + `guide/` 학습 모듈(Module)** 구조로 관리합니다.

모듈화 판정(Trigger) 중 하나라도 해당하면 **필수(MUST)**입니다.

```text
