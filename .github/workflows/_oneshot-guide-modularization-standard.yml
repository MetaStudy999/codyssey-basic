          text = registry.read_text(encoding='utf-8')
          old = '- [2.1 목차·빠른 시작](#navigation)\n- [3. 입문자 문서 품질 감사](#beginner-audit)'
          new = '- [2.1 목차·빠른 시작](#navigation)\n- [2.2 긴 입문자 가이드 모듈화](#guide-modularization)\n- [3. 입문자 문서 품질 감사](#beginner-audit)'
          if old not in text:
