name: Validate New Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'config/**'
      - 'docs/**'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/v3-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-new-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Generate current Mission outputs for validation
        run: python scripts/sync_progress.py
      - name: Verify Mission generated outputs
        run: python scripts/sync_progress.py --check
      - name: Verify Growth generated outputs
        run: python scripts/sync_growth.py --check
      - name: Validate repository and dashboard contract
        run: python scripts/validate_v3.py
      - name: Enforce removed legacy path gate
        run: python scripts/scan_legacy_refs.py --fail-on-active
      - name: Enforce learning canonical-path gate
        run: python scripts/scan_legacy_refs.py --targets docs/04-learning --fail-on-active
      - name: Enforce progress canonical-path gate
        run: python scripts/scan_legacy_refs.py --targets docs/03-progress --fail-on-active
      - name: Enforce final V2 compatibility-path gate
        run: >-
          python scripts/scan_legacy_refs.py
          --targets docs/01-overview docs/02-domains docs/05-architecture docs/06-evaluation docs/07-portfolio docs/08-resources
          --fail-on-active
      - name: Install browser smoke dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run new-baseline browser smoke
        run: python scripts/browser_smoke.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-baseline-browser-smoke
          path: |
            browser-smoke.png
            browser-smoke-mobile.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload static site preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-baseline-site-preview
          path: site
          if-no-files-found: error
          retention-days: 7
