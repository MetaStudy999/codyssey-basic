name: Validate Growth OS V3

on:
  push:
    branches: [rebuild/growth-os-v3]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'config/**'
      - 'docs/**'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/v3-validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'config/**'
      - 'docs/**'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/v3-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-growth-os-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Verify Mission generated outputs
        run: python scripts/sync_progress.py --check
      - name: Verify Growth OS generated outputs
        run: python scripts/sync_growth.py --check
      - name: Validate V3 structure, links and dashboard wiring
        run: python scripts/validate_v3.py
