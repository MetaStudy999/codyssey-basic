name: Sync Mission Progress

on:
  push:
    branches: [main]
    paths:
      - 'config/missions.yaml'
      - 'scripts/sync_progress.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-mission-progress
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate README, progress dashboard, and site data
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python scripts/sync_progress.py
      - name: Commit generated files when changed
        run: |
          if git diff --quiet -- README.md docs/03-progress/progress.md site/data/missions.json; then
            echo "Generated progress files are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/03-progress/progress.md site/data/missions.json
          git commit -m "chore: sync mission progress views"
          git push
