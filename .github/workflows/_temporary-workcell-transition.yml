name: temporary workcell transition

on:
  push:
    branches:
      - chore/pause-b2-2-resume-b4-1
    paths:
      - '.github/workflows/_temporary-workcell-transition.yml'

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pause-b2-2-resume-b4-1
          fetch-depth: 0

      - name: Patch current operational documents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patches = {
              'MISSION-RUNBOOK.md': [
                  (
                      'B2-2 = 🟡 ACTIVE\nB4-1 = ⏸ PAUSED / READY TO RESUME   # 이전 B1-1 시스템 관제',
                      'B4-1 = 🟡 ACTIVE   # 이전 B1-1 시스템 관제\nB2-2 = ⏸ PAUSED / TEAM WORK IN PROGRESS'
                  ),
                  (
                      '4. [B2-2 입문자 따라하기](https://github.com/MetaStudy999/codyssey-basic-git-collaboration/blob/main/training/round-01-clear/BEGINNER-GUIDE.md)',
                      '4. [B4-1 입문자 따라하기](https://github.com/MetaStudy999/codyssey-basic-system-monitor/blob/main/training/round-01-clear/BEGINNER-GUIDE.md)'
                  ),
              ],
              'training/round-01-clear/RUNTIME-EXECUTION-MATRIX.md': [
                  (
                      'B4-1 = ⏸ PAUSED / READY TO RESUME   # 이전 B1-1 시스템 관제\nB2-2 = 🟡 ACTIVE',
                      'B4-1 = 🟡 ACTIVE   # 이전 B1-1 시스템 관제\nB2-2 = ⏸ PAUSED / TEAM WORK IN PROGRESS'
                  ),
                  (
                      'B4-1 일시정지는 FAIL 또는 CLEAR가 아닙니다. B2-2의 현재 문서/Simulation 준비도 실제 팀 Runtime PASS를 의미하지 않습니다.',
                      'B2-2 일시정지는 FAIL 또는 CLEAR가 아닙니다. B2-2에서 확보한 MAC-V Host/CORE 준비 기록은 보존하며, 현재 B4-1 Runtime은 별도로 실제 실행·검증합니다.'
                  ),
                  (
                      '| 1 | **B4-1** | 시스템 관제 | ⬜ NOT RUN | ⬜ NOT RUN | ⬜ NOT VERIFIED | ⏸ PAUSED / READY TO RESUME |',
                      '| 1 | **B4-1** | 시스템 관제 | ⬜ NOT RUN | ⬜ NOT RUN | ⬜ NOT VERIFIED | 🟡 ACTIVE |'
                  ),
                  (
                      '| 4 | **B2-2** | Git 팀 협업 | ⬜ NOT RUN | ⬜ NOT RUN | ⬜ NOT VERIFIED | 🟡 ACTIVE |',
                      '| 4 | **B2-2** | Git 팀 협업 | ⬜ NOT RUN | ⬜ NOT RUN | ⬜ NOT VERIFIED | ⏸ PAUSED / TEAM WORK IN PROGRESS |'
                  ),
              ],
              'docs/R01-OPERATING-MODEL.md': [
                  (
                      'Mission 상태는 네 가지만 사용합니다.\n\n- `⬜ NOT STARTED`\n- `🟡 ACTIVE`\n- `⛔ BLOCKED`\n- `✅ CLEAR`',
                      'Mission/Workcell 상태는 다음을 사용합니다.\n\n- `⬜ NOT STARTED`\n- `🟡 ACTIVE`\n- `⏸ PAUSED`\n- `⛔ BLOCKED`\n- `✅ CLEAR`'
                  ),
                  (
                      '         ├─ B2-2 Git 협업             🟡 ACTIVE\n         ├─ B4-1 시스템 관제          ⏸ PAUSED / READY TO RESUME',
                      '         ├─ B4-1 시스템 관제          🟡 ACTIVE\n         ├─ B2-2 Git 협업             ⏸ PAUSED / TEAM WORK IN PROGRESS'
                  ),
                  (
                      'B2-2 현재 Workcell 수행\n→ 실제 팀 Runtime / Verification / Evidence 확보\n→ 조건 충족 시 ✅ CLEAR\n\nB4-1 시스템 관제\n→ 기존 PAUSED 상태를 유지\n→ 후속에 Runtime / Verification / Evidence 재개',
                      'B4-1 시스템 관제 현재 Workcell 수행\n→ Current Runtime Context 선택\n→ Runtime / Verification / Evidence 확보\n→ 조건 충족 시 ✅ CLEAR\n\nB2-2 Git 협업\n→ 실제 팀과 별도 진행 중이므로 PAUSED 상태 유지\n→ 팀 진행 후 실제 Evidence를 검증하며 재개'
                  ),
                  (
                      'B2-2의 5계정 Simulation 준비나 수행은 실제 3~5인 팀 Mission CLEAR를 자동으로 의미하지 않습니다.',
                      'B2-2의 기존 MAC-V Host/CORE 준비와 5계정 학습 상태는 보존되며, 실제 3~5인 팀 Mission Evidence와 분리합니다.'
                  ),
              ],
              'environments/ubuntu/ENVIRONMENT-CLOSEOUT.md': [
                  (
                      '번호 재편 전 B1-1이었던 시스템 관제 미션은 현재 **B4-1**이며, 현재 Workcell 포커스는 **B2-2**입니다.',
                      '번호 재편 전 B1-1이었던 시스템 관제 미션은 현재 **B4-1**이며, 현재 Workcell 포커스는 **B4-1**입니다. B2-2 Git 협업은 사용자가 실제 팀과 별도로 진행 중이므로 이 Control Tower 실행에서는 일시 보류합니다.'
                  ),
                  (
                      'Current Workcell                       B2-2 🟡 ACTIVE\nB4-1 시스템 관제                       ⏸ PAUSED / READY TO RESUME',
                      'Current Workcell                       B4-1 🟡 ACTIVE\nB2-2 Git 협업                           ⏸ PAUSED / TEAM WORK IN PROGRESS'
                  ),
                  (
                      '> 위 준비 기록은 **Mission Runtime PASS가 아닙니다.** B2-2와 B4-1을 포함한 각 미션의 MAC-V/WIN-V 실제 수행 기록은 `training/round-01-clear/RUNTIME-EXECUTION-MATRIX.md`에서 별도로 관리합니다.',
                      '> 위 준비 기록은 **Mission Runtime PASS가 아닙니다.** B4-1의 현재 Runtime과 B2-2의 보류된 팀/Simulation 상태를 포함한 각 미션 수행 기록은 `training/round-01-clear/RUNTIME-EXECUTION-MATRIX.md`에서 별도로 관리합니다.'
                  ),
                  (
                      '번호 재편 전 B1-1(현재 **B4-1 시스템 관제**)에서 검증한 3계층 문서 구조, SSH/UFW 안전 절차, Secret 보호, Verification/Evidence/CLEAR 분리 기준은 역사적 패턴으로 유지합니다. 현재 B2-2에는 Git/GitHub 협업 Runtime과 Simulation 분리 기준을 적용합니다.',
                      '번호 재편 전 B1-1(현재 **B4-1 시스템 관제**)에서 검증한 3계층 문서 구조, SSH/UFW 안전 절차, Secret 보호, Verification/Evidence/CLEAR 분리 기준을 현재 B4-1 Runtime에 적용합니다. B2-2의 Git/GitHub 협업 Runtime과 Simulation 분리 기준은 보류 상태로 보존합니다.'
                  ),
                  (
                      '현재 Workcell\n→ B2-2 Git 협업 🟡 ACTIVE\n→ Repository: codyssey-basic-git-collaboration\n\n학교 Mac에서 작업\n→ MAC-V\n→ Bootstrap / Identity 현재 상태 확인\n→ B2-2 Runtime / Simulation 준비\n\n노트북 Win11에서 작업\n→ WIN-V\n→ 기존 환경 Verification / Identity 확인\n→ B2-2 Runtime / Simulation 준비\n\nB4-1 시스템 관제\n→ ⏸ PAUSED / READY TO RESUME\n→ Repository: codyssey-basic-system-monitor\n→ 재개 시 해당 Runtime Context에서 Preflight부터 수행',
                      '현재 Workcell\n→ B4-1 시스템 관제 🟡 ACTIVE\n→ Repository: codyssey-basic-system-monitor\n\n학교 Mac에서 작업\n→ MAC-V\n→ Bootstrap / Identity 현재 상태 확인\n→ B4-1 Preflight / Runtime\n\n노트북 Win11에서 작업\n→ WIN-V\n→ 기존 환경 Verification / Identity 확인\n→ B4-1 Preflight / Runtime\n\nB2-2 Git 협업\n→ ⏸ PAUSED / TEAM WORK IN PROGRESS\n→ Repository: codyssey-basic-git-collaboration\n→ 기존 MAC-V Host/CORE 준비 기록 보존\n→ 실제 팀 진행 후 Evidence 검증 시 재개'
                  ),
              ],
          }

          for filename, replacements in patches.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'[FAIL] expected text not found: {filename}: {old[:80]!r}')
                  text = text.replace(old, new)
              path.write_text(text)
              print(f'[UPDATED] {filename}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MISSION-RUNBOOK.md training/round-01-clear/RUNTIME-EXECUTION-MATRIX.md docs/R01-OPERATING-MODEL.md environments/ubuntu/ENVIRONMENT-CLOSEOUT.md
          git commit -m 'docs: propagate B4-1 active and B2-2 paused status'
          git push origin HEAD:chore/pause-b2-2-resume-b4-1
